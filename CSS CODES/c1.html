<!DOCTYPE html>
<html>
<head>
    <title>CSS Types</title>

    <!-- External CSS -->
    <link rel="stylesheet" href="style.css">

    <!-- Internal CSS -->
    <style>
        .internal {
            background-color: lightgreen;
            color: darkgreen;
            padding: 20px;
            margin: 10px;
        }
    </style>
</head>

<body>

    <!-- Inline CSS -->
    <h1 style="color: red; text-align: center;">
        Inline CSS
    </h1>

    <!-- Internal CSS -->
    <div class="internal">
        <h2>Internal CSS</h2>
        <p>This section is styled using internal CSS.</p>
    </div>

    <!-- External CSS -->
    <div class="external">
        <h2>External CSS</h2>
        <p>This section is styled using an external CSS file.</p>
    </div>

</body>
</html>
