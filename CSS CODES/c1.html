<!DOCTYPE html>
<html>
<head>
    <title>CSS Types</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .internal { background-color: lightgreen; color: darkgreen; padding: 20px; margin: 10px; }
    </style>
</head>
<body>
    <h1 style="color: red; text-align: center;">Inline CSS</h1>
    <div class="internal"><h2>Internal CSS</h2><p>This section is styled using internal CSS.</p></div>
    <div class="external"><h2>External CSS</h2><p>This section is styled using an external CSS file.</p></div>
</body>
</html>
