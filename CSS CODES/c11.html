<!DOCTYPE html>
<html>
<head>
    <title>CSS Pseudo Elements</title>

    <style>
        body {
            font-family: Arial;
            padding: 30px;
        }

        h1::before {
            content: "★ ";
            color: orange;
        }

        h1::after {
            content: " ★";
            color: orange;
        }

        p::first-letter {
            font-size: 40px;
            color: blue;
            font-weight: bold;
        }

        p::first-line {
            font-weight: bold;
            color: green;
        }

        .box::before {
            content: "Important: ";
            font-weight: bold;
            color: red;
        }

        .box::after {
            content: " ✔";
            color: green;
        }
    </style>
</head>

<body>

    <h1>Pseudo Elements</h1>

    <p>
        CSS pseudo-elements allow us to style specific parts
        of an HTML element without adding extra HTML elements.
    </p>

    <div class="box">
        This text demonstrates the before and after pseudo-elements.
    </div>

</body>
</html>
