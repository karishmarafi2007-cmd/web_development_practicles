<!DOCTYPE html>
<html>
<head>
    <title>Registration Form</title>

    <style>
        body {
            font-family: Arial;
            background-color: #f0f4f8;
            padding: 30px;
        }

        .form-container {
            width: 400px;
            max-width: 90%;
            margin: auto;
            background-color: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 20px gray;
        }

        h1 {
            text-align: center;
            color: darkblue;
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            border: 1px solid gray;
            border-radius: 6px;
            box-sizing: border-box;
        }

        input:focus,
        select:focus,
        textarea:focus {
            border: 2px solid blue;
            outline: none;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 20px;
            border: none;
            border-radius: 6px;
            background-color: darkblue;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background-color: blue;
        }
    </style>
</head>

<body>

    <div class="form-container">

        <h1>Registration Form</h1>

        <form>

            <label>Name</label>
            <input type="text" placeholder="Enter your name">

            <label>Email</label>
            <input type="email" placeholder="Enter your email">

            <label>Password</label>
            <input type="password" placeholder="Enter password">

            <label>Course</label>

            <select>
                <option>Computing & Data Science</option>
                <option>Computer Science</option>
                <option>Artificial Intelligence</option>
                <option>Data Science</option>
            </select>

            <label>Message</label>

            <textarea rows="4"
                placeholder="Enter your message"></textarea>

            <button type="submit">
                Register
            </button>

        </form>

    </div>

</body>
</html>
