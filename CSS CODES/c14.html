<!DOCTYPE html>
<html>
<head>
    <title>CSS Flexbox</title>

    <style>
        body {
            font-family: Arial;
            padding: 30px;
        }

        .container {
            display: flex;

            justify-content: center;

            align-items: center;

            flex-wrap: wrap;

            gap: 20px;

            background-color: #eeeeee;

            padding: 30px;
        }

        .box {
            width: 150px;
            height: 150px;

            display: flex;

            justify-content: center;

            align-items: center;

            background-color: lightblue;

            border: 2px solid blue;

            font-size: 20px;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <h1>CSS Flexbox</h1>

    <div class="container">

        <div class="box">Box 1</div>

        <div class="box">Box 2</div>

        <div class="box">Box 3</div>

        <div class="box">Box 4</div>

    </div>

</body>
</html>
