<!DOCTYPE html>
<html>
<head>
    <title>CSS Animation</title>

    <style>
        body {
            font-family: Arial;
            text-align: center;
            padding: 50px;
        }

        .box {
            width: 100px;
            height: 100px;

            background-color: blue;

            margin: 100px auto;

            animation: moveBox 3s infinite alternate;
        }

        @keyframes moveBox {

            0% {
                transform: translateX(-200px);
            }

            50% {
                transform: translateY(-100px);
                border-radius: 50%;
            }

            100% {
                transform: translateX(200px);
                background-color: red;
            }
        }
    </style>
</head>

<body>

    <h1>CSS Animation</h1>

    <div class="box"></div>

</body>
</html>
