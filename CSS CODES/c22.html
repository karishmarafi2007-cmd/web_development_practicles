<!DOCTYPE html>
<html>
<head>
    <title>Login Page</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            background: linear-gradient(
                135deg,
                #dbeafe,
                #ede9fe
            );
        }

        .login-box {
            width: 380px;
            max-width: 90%;

            background: white;

            padding: 35px;

            border-radius: 15px;

            box-shadow: 0 10px 30px #aaa;
        }

        h1 {
            text-align: center;
            color: #1e3a8a;
        }

        label {
            display: block;
            margin-top: 18px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;

            margin-top: 7px;

            border: 1px solid #bbb;

            border-radius: 7px;
        }

        input:focus {
            border: 2px solid #2563eb;
            outline: none;
        }

        button {
            width: 100%;

            padding: 12px;

            margin-top: 25px;

            background: #2563eb;

            color: white;

            border: none;

            border-radius: 7px;

            font-size: 16px;

            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        .forgot {
            text-align: right;
            margin-top: 10px;
        }

        .forgot a {
            color: #2563eb;
            text-decoration: none;
        }

        .signup {
            text-align: center;
            margin-top: 20px;
        }
    </style>
</head>

<body>

    <div class="login-box">

        <h1>Login</h1>

        <form>

            <label>Email</label>

            <input
                type="email"
                placeholder="Enter your email"
                required
            >

            <label>Password</label>

            <input
                type="password"
                placeholder="Enter your password"
                required
            >

            <div class="forgot">
                <a href="#">Forgot Password?</a>
            </div>

            <button type="submit">
                Login
            </button>

        </form>

        <div class="signup">
            Don't have an account?
            <a href="#">Sign Up</a>
        </div>

    </div>

</body>
</html>
