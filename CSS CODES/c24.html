<!DOCTYPE html>
<html>
<head>
    <title>Responsive Photo Gallery</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial;
            background: #f5f5f5;
            padding: 30px;
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
        }

        .gallery {
            display: grid;

            grid-template-columns:
                repeat(auto-fit, minmax(220px, 1fr));

            gap: 20px;
        }

        .gallery img {
            width: 100%;
            height: 220px;

            object-fit: cover;

            border-radius: 12px;

            transition: 0.4s;
        }

        .gallery img:hover {
            transform: scale(1.05);
            filter: brightness(80%);
        }
    </style>
</head>

<body>

    <h1>Photo Gallery</h1>

    <div class="gallery">

        <img
            src="https://picsum.photos/500/400?random=1"
            alt="Photo 1"
        >

        <img
            src="https://picsum.photos/500/400?random=2"
            alt="Photo 2"
        >

        <img
            src="https://picsum.photos/500/400?random=3"
            alt="Photo 3"
        >

        <img
            src="https://picsum.photos/500/400?random=4"
            alt="Photo 4"
        >

        <img
            src="https://picsum.photos/500/400?random=5"
            alt="Photo 5"
        >

        <img
            src="https://picsum.photos/500/400?random=6"
            alt="Photo 6"
        >

    </div>

</body>
</html>
