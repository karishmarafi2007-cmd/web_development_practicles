<!DOCTYPE html>
<html>
<head>
    <title>CSS Combinators</title>

    <style>

        body {
            font-family: Arial;
            padding: 30px;
        }

        /* Descendant selector */
        .container p {
            color: blue;
        }

        /* Child selector */
        .container > h2 {
            color: red;
        }

        /* Adjacent sibling */
        h3 + p {
            background-color: yellow;
            padding: 10px;
        }

        /* General sibling */
        h4 ~ p {
            color: green;
            font-weight: bold;
        }

        .container {
            padding: 20px;
            border: 2px solid black;
        }

    </style>
</head>

<body>

    <div class="container">

        <h2>Child Selector</h2>

        <div>

            <p>
                Descendant paragraph inside nested div.
            </p>

        </div>

        <p>
            Direct child paragraph.
        </p>

    </div>


    <h3>Adjacent Sibling Example</h3>

    <p>
        This paragraph immediately follows h3.
    </p>


    <h4>General Sibling Example</h4>

    <p>
        General sibling paragraph 1.
    </p>

    <p>
        General sibling paragraph 2.
    </p>

</body>
</html>
