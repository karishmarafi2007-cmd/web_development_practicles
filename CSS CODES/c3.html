<!DOCTYPE html>
<html>
<head>
    <title>Colors Backgrounds Borders</title>

    <style>

        body {
            font-family: Arial;
            background-color: lightgray;
            padding: 30px;
        }

        .box {
            background-color: lightblue;
            color: darkblue;

            border: 5px solid blue;
            border-radius: 15px;

            padding: 30px;
            text-align: center;
        }

        .box2 {
            background-color: yellow;
            color: red;

            border: 3px dashed red;

            padding: 20px;
            margin-top: 20px;
        }

    </style>
</head>

<body>

    <div class="box">
        <h1>CSS Colors</h1>
        <p>Background, text color and border are demonstrated.</p>
    </div>

    <div class="box2">
        <h2>Another Box</h2>
        <p>This uses a dashed border.</p>
    </div>

</body>
</html>
