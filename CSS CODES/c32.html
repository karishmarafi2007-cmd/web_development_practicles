<!DOCTYPE html>
<html>
<head>
    <title>CSS Shadows</title>

    <style>
        body {
            font-family: Arial;
            background: #eef2f7;
            padding: 40px;
            text-align: center;
        }

        h1 {
            color: #1e3a8a;

            text-shadow:
                3px 3px 5px gray;
        }

        .card {
            width: 350px;
            margin: 50px auto;

            padding: 40px;

            background: white;

            border-radius: 15px;

            box-shadow:
                0 10px 25px rgba(0, 0, 0, 0.25);
        }

        .card h2 {
            text-shadow:
                2px 2px 3px #aaa;
        }

        .inner {
            margin-top: 20px;
            padding: 20px;

            box-shadow:
                inset 0 0 15px rgba(0, 0, 0, 0.25);
        }
    </style>
</head>

<body>

    <h1>CSS Shadow Effects</h1>

    <div class="card">

        <h2>Box Shadow</h2>

        <p>
            This card uses box-shadow.
        </p>

        <div class="inner">
            Inner Shadow
        </div>

    </div>

</body>
</html>
