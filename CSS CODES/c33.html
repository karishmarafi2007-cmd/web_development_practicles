<!DOCTYPE html>
<html>
<head>
    <title>Border Radius</title>

    <style>
        body {
            font-family: Arial;
            text-align: center;
            padding: 30px;
            background: #f5f5f5;
        }

        .container {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            gap: 30px;
        }

        .shape {
            width: 150px;
            height: 150px;

            display: flex;
            justify-content: center;
            align-items: center;

            background: #60a5fa;
            color: white;
            font-weight: bold;
        }

        .circle {
            border-radius: 50%;
        }

        .rounded {
            border-radius: 25px;
        }

        .pill {
            width: 220px;
            border-radius: 100px;
        }

        .special {
            border-radius: 10px 50px 10px 50px;
        }
    </style>
</head>

<body>

    <h1>Border Radius Shapes</h1>

    <div class="container">

        <div class="shape rounded">
            Rounded
        </div>

        <div class="shape circle">
            Circle
        </div>

        <div class="shape pill">
            Pill
        </div>

        <div class="shape special">
            Special
        </div>

    </div>

</body>
</html>
