<!DOCTYPE html>
<html>
<head>
    <title>CSS Z Index</title>

    <style>
        body {
            font-family: Arial;
            padding: 30px;
        }

        .container {
            position: relative;
            width: 500px;
            height: 400px;

            margin: 50px auto;
        }

        .box {
            width: 220px;
            height: 150px;

            position: absolute;

            display: flex;
            justify-content: center;
            align-items: center;

            color: white;
            font-weight: bold;

            border: 3px solid white;
        }

        .box1 {
            background: red;
            left: 20px;
            top: 50px;
            z-index: 1;
        }

        .box2 {
            background: blue;
            left: 100px;
            top: 100px;
            z-index: 2;
        }

        .box3 {
            background: green;
            left: 180px;
            top: 150px;
            z-index: 3;
        }
    </style>
</head>

<body>

    <h1 style="text-align:center;">
        Z-Index and Stacking Order
    </h1>

    <div class="container">

        <div class="box box1">
            z-index: 1
        </div>

        <div class="box box2">
            z-index: 2
        </div>

        <div class="box box3">
            z-index: 3
        </div>

    </div>

</body>
</html>
