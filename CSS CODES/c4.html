<!DOCTYPE html>
<html>
<head>
    <title>Font Properties</title>

    <style>

        body {
            font-family: Arial;
            padding: 30px;
        }

        h1 {
            font-family: Georgia;
            font-size: 40px;
            font-weight: bold;
            color: darkblue;
        }

        .text {
            font-size: 20px;
            font-style: italic;
            font-weight: bold;

            text-align: justify;
            text-transform: uppercase;

            text-decoration: underline;

            letter-spacing: 2px;
            word-spacing: 5px;

            line-height: 1.8;
        }

        .center {
            text-align: center;
            text-transform: capitalize;
        }

    </style>
</head>

<body>

    <h1>Font Properties</h1>

    <p class="text">
        CSS provides many properties for changing fonts and text.
        We can control size, style, weight, spacing and alignment.
    </p>

    <h2 class="center">
        Text Formatting Example
    </h2>

</body>
</html>
