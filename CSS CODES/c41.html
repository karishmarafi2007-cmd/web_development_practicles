<!DOCTYPE html>
<html>
<head>
    <title>Experiment 41 - Button Hover Animation</title>

    <style>
        body {
            font-family: Arial;
            text-align: center;
            background-color: #f4f4f4;
            padding: 100px;
        }

        .btn {
            padding: 15px 35px;
            font-size: 18px;
            color: white;
            background-color: #007bff;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.4s;
        }

        .btn:hover {
            background-color: #0056b3;
            transform: scale(1.1);
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
        }
    </style>
</head>

<body>

    <h1>Button Hover Animation</h1>

    <button class="btn">Hover Me</button>

</body>
</html>
