<!DOCTYPE html>
<html>
<head>
    <title>Experiment 44 - Responsive Image Gallery</title>

    <style>
        body {
            font-family: Arial;
            margin: 0;
            background-color: #f5f5f5;
        }

        h1 {
            text-align: center;
            padding: 20px;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 15px;
            padding: 20px;
        }

        .gallery img {
            width: 100%;
            height: 220px;
            object-fit: cover;
            border-radius: 10px;
            transition: 0.3s;
        }

        .gallery img:hover {
            transform: scale(1.05);
        }
    </style>
</head>

<body>

    <h1>Responsive Image Gallery</h1>

    <div class="gallery">

        <img src="https://picsum.photos/id/1011/500/400" alt="Image 1">
        <img src="https://picsum.photos/id/1012/500/400" alt="Image 2">
        <img src="https://picsum.photos/id/1013/500/400" alt="Image 3">
        <img src="https://picsum.photos/id/1015/500/400" alt="Image 4">
        <img src="https://picsum.photos/id/1016/500/400" alt="Image 5">
        <img src="https://picsum.photos/id/1018/500/400" alt="Image 6">
        <img src="https://picsum.photos/id/1020/500/400" alt="Image 7">
        <img src="https://picsum.photos/id/1024/500/400" alt="Image 8">

    </div>

</body>
</html>
