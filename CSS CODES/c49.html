<!DOCTYPE html>
<html>
<head>
    <title>Experiment 48 - Three Column Layout</title>

    <style>
        body {
            margin: 0;
            font-family: Arial;
            background-color: #f5f5f5;
        }

        h1 {
            text-align: center;
            padding: 20px;
        }

        .container {
            display: flex;
            gap: 20px;
            padding: 20px;
        }

        .column {
            flex: 1;
            padding: 30px;
            background-color: white;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 3px 10px #ccc;
        }

        .column h2 {
            color: #007bff;
        }

        @media (max-width: 700px) {
            .container {
                flex-direction: column;
            }
        }
    </style>
</head>

<body>

    <h1>Three Column Layout</h1>

    <div class="container">

        <div class="column">
            <h2>HTML</h2>
            <p>Structure of webpages.</p>
        </div>

        <div class="column">
            <h2>CSS</h2>
            <p>Styling of webpages.</p>
        </div>

        <div class="column">
            <h2>JavaScript</h2>
            <p>Behavior and interaction.</p>
        </div>

    </div>

</body>
</html>
