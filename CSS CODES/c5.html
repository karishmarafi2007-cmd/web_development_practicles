<!DOCTYPE html>
<html>
<head>
    <title>CSS Box Model</title>

    <style>

        body {
            font-family: Arial;
            background-color: #f2f2f2;
            padding: 30px;
        }

        .box {
            width: 300px;

            /* Content */
            background-color: lightblue;

            /* Padding */
            padding: 30px;

            /* Border */
            border: 10px solid blue;

            /* Margin */
            margin: 50px auto;

            text-align: center;
        }

    </style>
</head>

<body>

    <h1>CSS Box Model</h1>

    <div class="box">
        <h2>Content</h2>
        <p>
            Padding, border and margin are used around this content.
        </p>
    </div>

</body>
</html>
