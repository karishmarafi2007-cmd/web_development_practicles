<!DOCTYPE html>
<html>
<head>
    <title>Experiment 52 - Responsive Login</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial;
            background: linear-gradient(135deg, #667eea, #764ba2);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 850px;
            display: flex;
            background-color: white;
            border-radius: 15px;
            overflow: hidden;
        }

        .welcome {
            flex: 1;
            background-color: #333;
            color: white;
            padding: 50px;
        }

        .login {
            flex: 1;
            padding: 50px;
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        button {
            width: 100%;
            padding: 12px;
            background-color: #667eea;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        button:hover {
            background-color: #4f63c7;
        }

        @media (max-width: 700px) {

            .container {
                width: 90%;
                flex-direction: column;
            }

            .welcome,
            .login {
                padding: 30px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="welcome">
            <h1>Welcome!</h1>
            <p>
                Login to access your account and continue
                learning.
            </p>
        </div>

        <div class="login">

            <h2>Login</h2>

            <form>
                <input type="email" placeholder="Email">
                <input type="password" placeholder="Password">

                <button type="submit">Login</button>
            </form>

            <p>Don't have an account? Sign Up</p>

        </div>

    </div>

</body>
</html>
