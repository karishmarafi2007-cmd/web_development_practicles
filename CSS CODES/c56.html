<!DOCTYPE html>
<html>
<head>
    <title>Experiment 56 - Online Shopping</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial;
            background-color: #f5f5f5;
        }

        header {
            background-color: #222;
            color: white;
            padding: 20px;
        }

        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 10px;
        }

        .products {
            padding: 40px;
        }

        .product-container {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
        }

        .product {
            background-color: white;
            padding: 20px;
            text-align: center;
            border-radius: 10px;
        }

        .product img {
            width: 100%;
            height: 180px;
            object-fit: cover;
            border-radius: 8px;
        }

        .product button {
            padding: 10px 20px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .product button:hover {
            background-color: #0056b3;
        }

        @media (max-width: 900px) {
            .product-container {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 500px) {

            .navbar {
                flex-direction: column;
            }

            .product-container {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <header>

        <div class="navbar">

            <h2>ShopEasy</h2>

            <nav>
                <a href="#">Home</a>
                <a href="#">Products</a>
                <a href="#">Cart</a>
                <a href="#">Login</a>
            </nav>

        </div>

    </header>

    <section class="products">

        <h1>Featured Products</h1>

        <div class="product-container">

            <div class="product">
                <img src="https://picsum.photos/id/1/400/300">
                <h3>Laptop</h3>
                <p>₹55,000</p>
                <button>Add to Cart</button>
            </div>

            <div class="product">
                <img src="https://picsum.photos/id/20/400/300">
                <h3>Headphones</h3>
                <p>₹2,500</p>
                <button>Add to Cart</button>
            </div>

            <div class="product">
                <img src="https://picsum.photos/id/30/400/300">
                <h3>Camera</h3>
                <p>₹35,000</p>
                <button>Add to Cart</button>
            </div>

            <div class="product">
                <img src="https://picsum.photos/id/40/400/300">
                <h3>Smart Watch</h3>
                <p>₹4,000</p>
                <button>Add to Cart</button>
            </div>

        </div>

    </section>

</body>
</html>
