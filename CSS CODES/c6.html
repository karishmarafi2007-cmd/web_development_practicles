<!DOCTYPE html>
<html>
<head>
    <title>Width Height Sizing</title>

    <style>

        body {
            font-family: Arial;
            padding: 20px;
        }

        .box1 {
            width: 50%;
            height: 100px;
            background-color: lightblue;
            margin-bottom: 20px;
        }

        .box2 {
            width: 300px;
            min-width: 200px;
            max-width: 500px;

            height: 150px;

            background-color: lightgreen;
            margin-bottom: 20px;
        }

        .box3 {
            width: 80vw;
            height: 20vh;

            background-color: lightpink;
        }

    </style>
</head>

<body>

    <h1>CSS Width and Height</h1>

    <div class="box1">
        Width: 50%
    </div>

    <div class="box2">
        Min-width, Max-width and Fixed Width
    </div>

    <div class="box3">
        Width: 80vw and Height: 20vh
    </div>

</body>
</html>
