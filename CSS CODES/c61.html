<!DOCTYPE html>
<html>
<head>
    <title>Experiment 61 - Flexbox Alignment</title>

    <style>
        body {
            font-family: Arial;
            background-color: #f4f4f4;
            text-align: center;
        }

        .container {
            display: flex;
            justify-content: space-around;
            align-items: center;
            height: 300px;
            background-color: white;
            border: 3px solid #333;
            margin: 30px;
        }

        .box {
            width: 120px;
            padding: 30px 10px;
            background-color: #007bff;
            color: white;
            border-radius: 10px;
        }

        .box1 {
            order: 3;
        }

        .box2 {
            order: 1;
        }

        .box3 {
            order: 2;
        }
    </style>
</head>

<body>

    <h1>Flexbox Alignment and Ordering</h1>

    <div class="container">

        <div class="box box1">Box 1</div>
        <div class="box box2">Box 2</div>
        <div class="box box3">Box 3</div>

    </div>

</body>
</html>
