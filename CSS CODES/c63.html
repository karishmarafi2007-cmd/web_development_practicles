<!DOCTYPE html>
<html>
<head>
    <title>Experiment 63 - Mobile First</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial;
            background-color: #f4f4f4;
        }

        /* Mobile-first design */

        header {
            background-color: #222;
            color: white;
            text-align: center;
            padding: 20px;
        }

        nav {
            display: flex;
            flex-direction: column;
        }

        nav a {
            color: white;
            text-decoration: none;
            padding: 10px;
        }

        .content {
            padding: 20px;
        }

        .cards {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .card {
            background-color: white;
            padding: 25px;
            border-radius: 10px;
            text-align: center;
        }

        /* Tablet and desktop */

        @media (min-width: 600px) {

            nav {
                flex-direction: row;
                justify-content: center;
            }

            .cards {
                flex-direction: row;
                flex-wrap: wrap;
            }

            .card {
                flex: 1;
                min-width: 200px;
            }
        }

        @media (min-width: 1000px) {

            .content {
                max-width: 1100px;
                margin: auto;
            }

            .card {
                padding: 40px;
            }
        }
    </style>
</head>

<body>

    <header>

        <h1>My Website</h1>

        <nav>
            <a href="#">Home</a>
            <a href="#">About</a>
            <a href="#">Courses</a>
            <a href="#">Contact</a>
        </nav>

    </header>

    <main class="content">

        <h2>Welcome</h2>

        <div class="cards">

            <div class="card">
                <h3>HTML</h3>
                <p>Learn HTML.</p>
            </div>

            <div class="card">
                <h3>CSS</h3>
                <p>Learn CSS.</p>
            </div>

            <div class="card">
                <h3>JavaScript</h3>
                <p>Learn JavaScript.</p>
            </div>

        </div>

    </main>

</body>
</html>
