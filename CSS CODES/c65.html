<!DOCTYPE html>
<html>
<head>
    <title>Experiment 65 - CSS Transformations</title>

    <style>
        body {
            font-family: Arial;
            text-align: center;
            background-color: #f5f5f5;
        }

        .container {
            display: flex;
            justify-content: center;
            gap: 60px;
            flex-wrap: wrap;
            margin-top: 80px;
        }

        .box {
            width: 150px;
            height: 150px;
            background-color: #007bff;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: 0.5s;
        }

        .rotate:hover {
            transform: rotate(45deg);
        }

        .scale:hover {
            transform: scale(1.4);
        }

        .translate:hover {
            transform: translate(30px, 20px);
        }

        .three-d {
            transform-style: preserve-3d;
        }

        .three-d:hover {
            transform: rotateX(45deg) rotateY(45deg);
        }
    </style>
</head>

<body>

    <h1>2D and 3D Transformations</h1>

    <div class="container">

        <div class="box rotate">
            Rotate
        </div>

        <div class="box scale">
            Scale
        </div>

        <div class="box translate">
            Translate
        </div>

        <div class="box three-d">
            3D Rotate
        </div>

    </div>

</body>
</html>
