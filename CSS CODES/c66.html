<!DOCTYPE html>
<html>
<head>
    <title>Experiment 66 - Keyframe Animation</title>

    <style>
        body {
            font-family: Arial;
            text-align: center;
            background-color: #f5f5f5;
        }

        .box {
            width: 120px;
            height: 120px;
            background-color: #007bff;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 100px auto;

            animation: moveBox 4s infinite alternate;
        }

        @keyframes moveBox {

            0% {
                transform: translateX(-200px);
                background-color: #007bff;
            }

            50% {
                transform: translateX(0);
                background-color: #28a745;
                border-radius: 50%;
            }

            100% {
                transform: translateX(200px);
                background-color: #dc3545;
                border-radius: 0;
            }
        }
    </style>
</head>

<body>

    <h1>CSS Keyframe Animation</h1>

    <div class="box">
        Animate
    </div>

</body>
</html>
