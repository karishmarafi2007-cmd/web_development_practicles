<!DOCTYPE html>
<html>
<head>
    <title>Experiment 67 - Loading Spinner</title>

    <style>
        body {
            font-family: Arial;
            text-align: center;
            background-color: #f5f5f5;
            padding-top: 100px;
        }

        .spinner {
            width: 80px;
            height: 80px;
            border: 8px solid #ddd;
            border-top: 8px solid #007bff;
            border-radius: 50%;
            margin: 30px auto;

            animation: spin 1s linear infinite;
        }

        @keyframes spin {

            from {
                transform: rotate(0deg);
            }

            to {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body>

    <h1>Loading...</h1>

    <div class="spinner"></div>

    <p>Please wait</p>

</body>
</html>
