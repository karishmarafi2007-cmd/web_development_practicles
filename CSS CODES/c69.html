<!DOCTYPE html>
<html>
<head>
    <title>Experiment 69 - CSS Modal</title>

    <style>
        body {
            font-family: Arial;
            text-align: center;
            padding: 80px;
        }

        .open-button {
            display: inline-block;
            padding: 15px 30px;
            background-color: #007bff;
            color: white;
            text-decoration: none;
            border-radius: 6px;
        }

        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.6);

            display: none;
            justify-content: center;
            align-items: center;
        }

        .modal:target {
            display: flex;
        }

        .modal-content {
            width: 400px;
            max-width: 90%;
            background-color: white;
            padding: 30px;
            border-radius: 12px;
            position: relative;
        }

        .close {
            position: absolute;
            top: 10px;
            right: 15px;
            font-size: 25px;
            color: #333;
            text-decoration: none;
        }

        .close:hover {
            color: red;
        }
    </style>
</head>

<body>

    <h1>CSS-Only Modal</h1>

    <a href="#popup" class="open-button">
        Open Popup
    </a>

    <div id="popup" class="modal">

        <div class="modal-content">

            <a href="#" class="close">&times;</a>

            <h2>Hello!</h2>

            <p>
                This popup is created using only HTML and CSS.
            </p>

        </div>

    </div>

</body>
</html>
