<!DOCTYPE html>
<html>
<head>
    <title>Experiment 71 - Responsive Typography</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            text-align: center;
        }

        .container {
            width: 90%;
            max-width: 1000px;
            margin: auto;
            padding: 40px 20px;
        }

        h1 {
            font-size: clamp(2rem, 6vw, 5rem);
            color: #007bff;
        }

        h2 {
            font-size: clamp(1.5rem, 4vw, 3rem);
        }

        p {
            font-size: clamp(1rem, 2vw, 1.5rem);
            line-height: 1.6;
        }

        .box {
            background-color: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 10px #ccc;
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="box">

            <h1>Responsive Typography</h1>

            <h2>Resize the Browser Window</h2>

            <p>
                The size of this text changes automatically
                according to the screen width.
            </p>

            <p>
                This makes the webpage easier to read on
                mobile phones, tablets and desktops.
            </p>

        </div>

    </div>

</body>
</html>
