<!DOCTYPE html>
<html>
<head>
    <title>Experiment 73 - CSS Calc</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial;
            background-color: #f5f5f5;
        }

        header {
            height: 80px;
            background-color: #007bff;
            color: white;
            text-align: center;
            padding: 25px;
        }

        .container {
            width: calc(100% - 40px);
            max-width: 1100px;
            margin: 30px auto;
        }

        .content {
            width: calc(100% - 100px);
            margin: auto;
            background-color: white;
            padding: 30px;
            border-radius: 10px;
        }

        .box-container {
            display: flex;
            gap: 20px;
        }

        .box {
            width: calc(50% - 10px);
            padding: 40px;
            background-color: #e3f2fd;
            text-align: center;
            border-radius: 10px;
        }

        .footer {
            width: calc(100% - 40px);
            margin: 30px auto;
            padding: 20px;
            background-color: #222;
            color: white;
            text-align: center;
        }

        @media (max-width: 600px) {

            .content {
                width: 100%;
            }

            .box-container {
                flex-direction: column;
            }

            .box {
                width: 100%;
            }
        }
    </style>
</head>

<body>

    <header>
        <h2>CSS calc() Example</h2>
    </header>

    <div class="container">

        <div class="content">

            <h1>Using calc()</h1>

            <p>
                CSS calc() allows us to calculate dimensions
                dynamically.
            </p>

            <div class="box-container">

                <div class="box">
                    <h2>Box 1</h2>
                    <p>50% minus gap</p>
                </div>

                <div class="box">
                    <h2>Box 2</h2>
                    <p>50% minus gap</p>
                </div>

            </div>

        </div>

    </div>

    <div class="footer">
        CSS Practical - Experiment 73
    </div>

</body>
</html>
