<!DOCTYPE html>
<html>
<head>
    <title>Navigation Bar</title>

    <style>

        body {
            margin: 0;
            font-family: Arial;
        }

        nav {
            background-color: #111827;

            display: flex;

            justify-content: center;

            gap: 30px;

            padding: 20px;
        }

        nav a {
            color: white;

            text-decoration: none;

            padding: 10px 20px;

            border-radius: 8px;
        }

        nav a:hover {
            background-color: #2563eb;
        }

    </style>
</head>

<body>

    <nav>

        <a href="#">Home</a>

        <a href="#">About</a>

        <a href="#">Services</a>

        <a href="#">Projects</a>

        <a href="#">Contact</a>

    </nav>

</body>
</html>
