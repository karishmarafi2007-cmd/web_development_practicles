<!DOCTYPE html>
<html>
<head>
    <title>Internal and External CSS</title>

    <!-- External CSS -->
    <link rel="stylesheet" href="style.css">

    <!-- Internal CSS -->
    <style>
        h1 {
            text-align: center;
            font-family: Arial;
        }

        p {
            font-size: 18px;
            text-align: center;
        }
    </style>

</head>

<body>

    <h1>CSS Styling</h1>

    <p>
        This webpage demonstrates internal and external CSS.
    </p>

    <div class="box">
        This box is styled using external CSS.
    </div>

</body>
</html>
