<!DOCTYPE html>
<html>
<head>
    <title>CSS Properties</title>

    <style>

        /* Element selector */
        h1 {
            color: darkblue;
            font-family: Arial;
        }

        /* Class selector */
        .para {
            color: green;
            font-size: 18px;
            margin: 20px;
            padding: 15px;
            border: 2px solid black;
        }

        /* ID selector */
        #box {
            background-color: lightyellow;
            width: 300px;
            margin: 30px;
            padding: 25px;
            border: 3px solid red;
        }

        /* Group selector */
        h2, h3 {
            color: purple;
        }

    </style>
</head>

<body>

    <h1>CSS Selectors and Properties</h1>

    <h2>Class Selector</h2>

    <p class="para">
        This paragraph demonstrates colors, fonts,
        margin, padding and borders.
    </p>

    <h2>ID Selector</h2>

    <div id="box">
        This box demonstrates margin, padding,
        background color and border.
    </div>

    <h3>CSS is used to style webpages.</h3>

</body>
</html>
