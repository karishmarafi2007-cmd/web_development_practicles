<!DOCTYPE html>
<html>
<head>

    <title>Bootstrap Components</title>

    <!-- Bootstrap CSS -->
    <link 
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

</head>

<body>

    <!-- Navbar -->
    <nav class="navbar navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="#">
                My Website
            </a>
        </div>
    </nav>

    <!-- Main Container -->
    <div class="container mt-5">

        <h1 class="text-center">
            Bootstrap Components
        </h1>

        <!-- Alert -->
        <div class="alert alert-success mt-4">
            Welcome to my Bootstrap webpage!
        </div>

        <!-- Button -->
        <button class="btn btn-primary">
            Click Me
        </button>

        <!-- Cards -->
        <div class="row mt-4">

            <div class="col-md-4">

                <div class="card">

                    <div class="card-body">

                        <h5 class="card-title">
                            HTML
                        </h5>

                        <p class="card-text">
                            HTML creates the structure of webpages.
                        </p>

                        <a href="#" class="btn btn-primary">
                            Learn More
                        </a>

                    </div>

                </div>

            </div>

            <div class="col-md-4">

                <div class="card">

                    <div class="card-body">

                        <h5 class="card-title">
                            CSS
                        </h5>

                        <p class="card-text">
                            CSS is used to style webpages.
                        </p>

                        <a href="#" class="btn btn-success">
                            Learn More
                        </a>

                    </div>

                </div>

            </div>

            <div class="col-md-4">

                <div class="card">

                    <div class="card-body">

                        <h5 class="card-title">
                            JavaScript
                        </h5>

                        <p class="card-text">
                            JavaScript adds functionality.
                        </p>

                        <a href="#" class="btn btn-warning">
                            Learn More
                        </a>

                    </div>

                </div>

            </div>

        </div>

    </div>

</body>
</html>
