<!DOCTYPE html>
<html>
<head>
    <title>HTML Table</title>
</head>
<body>

    <h1>Student Details</h1>

    <table border="1" cellpadding="10" cellspacing="0">

        <tr>
            <th colspan="4">Student Information</th>
        </tr>

        <tr>
            <th>Roll No</th>
            <th>Name</th>
            <th>Course</th>
            <th>Marks</th>
        </tr>

        <tr>
            <td>33</td>
            <td>Karishma</td>
            <td>B.Tech</td>
            <td>90</td>
        </tr>

        <tr>
            <td>34</td>
            <td>Madhurya</td>
            <td>B.Tech</td>
            <td>88</td>
        </tr>

        <tr>
            <td rowspan="2">35</td>
            <td rowspan="2">Ananya</td>
            <td>Data Science</td>
            <td>92</td>
        </tr>

        <tr>
            <td colspan="2">Excellent Performance</td>
        </tr>

    </table>

</body>
</html>
