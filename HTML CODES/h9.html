<!DOCTYPE html>
<html>
<head>
    <title>HTML5 Input Types</title>
</head>
<body>

    <h1>HTML5 Input Types</h1>

    <form>

        <label>Name:</label>
        <input type="text">
        <br><br>

        <label>Email:</label>
        <input type="email">
        <br><br>

        <label>Password:</label>
        <input type="password">
        <br><br>

        <label>Date of Birth:</label>
        <input type="date">
        <br><br>

        <label>Age:</label>
        <input type="number" min="1" max="100">
        <br><br>

        <label>Phone:</label>
        <input type="tel">
        <br><br>

        <label>Website:</label>
        <input type="url">
        <br><br>

        <label>Color:</label>
        <input type="color">
        <br><br>

        <label>Range:</label>
        <input type="range" min="0" max="100">
        <br><br>

        <input type="submit" value="Submit">

    </form>

</body>
</html>
