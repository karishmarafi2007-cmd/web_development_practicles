<!DOCTYPE html>
<html>
<head>
    <title>Image Slideshow</title>

    <style>

        body {
            text-align: center;
            font-family: Arial;
        }

        .slideshow {
            width: 500px;
            margin: auto;
        }

        img {
            width: 500px;
            height: 300px;
            object-fit: cover;
            border-radius: 10px;
        }

        button {
            padding: 10px 20px;
            margin: 10px;
            cursor: pointer;
        }

    </style>
</head>

<body>

<h2>Image Slideshow / Carousel</h2>

<div class="slideshow">

    <img id="slideImage"
         src="https://picsum.photos/id/1015/500/300"
         alt="Slideshow Image">

</div>

<button onclick="previousImage()">Previous</button>

<button onclick="nextImage()">Next</button>


<script>

let images = [

    "https://picsum.photos/id/1015/500/300",

    "https://picsum.photos/id/1016/500/300",

    "https://picsum.photos/id/1018/500/300",

    "https://picsum.photos/id/1025/500/300"

];

let currentIndex = 0;


function showImage() {

    document.getElementById("slideImage").src =
        images[currentIndex];
}


function nextImage() {

    currentIndex++;

    if (currentIndex >= images.length) {
        currentIndex = 0;
    }

    showImage();
}


function previousImage() {

    currentIndex--;

    if (currentIndex < 0) {
        currentIndex = images.length - 1;
    }

    showImage();
}


// Automatically change image every 3 seconds

setInterval(nextImage, 3000);

</script>

</body>
</html>
