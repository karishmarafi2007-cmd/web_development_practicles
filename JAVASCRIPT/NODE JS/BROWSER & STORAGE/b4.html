<!DOCTYPE html>
<html>
<head>
    <title>History Object</title>
</head>

<body>

    <h2>History Object</h2>

    <p>
        History Length:
        <span id="length"></span>
    </p>

    <button onclick="goBack()">Go Back</button>
    <button onclick="goForward()">Go Forward</button>

<script>

document.getElementById("length").innerHTML =
    history.length;

function goBack() {
    history.back();
}

function goForward() {
    history.forward();
}

</script>

</body>
</html>
