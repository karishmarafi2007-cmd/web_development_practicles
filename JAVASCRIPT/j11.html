<!DOCTYPE html>
<html>
<head>
    <title>Sum of Digits</title>
</head>
<body>

<h2>Sum of Digits</h2>
<p id="output"></p>

<script>
    let number = Math.abs(Number(prompt("Enter a number:")));
    let sum = 0;

    while (number > 0) {
        let digit = number % 10;
        sum = sum + digit;
        number = Math.floor(number / 10);
    }

    document.getElementById("output").innerHTML =
        "Sum of digits = " + sum;
</script>

</body>
</html>
