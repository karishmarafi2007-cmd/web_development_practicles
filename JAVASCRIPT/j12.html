<!DOCTYPE html>
<html>
<head>
    <title>Largest and Smallest</title>
</head>
<body>

<h2>Array Elements</h2>
<p id="output"></p>

<script>
    let array = [25, 10, 45, 5, 80, 30];

    let largest = array[0];
    let smallest = array[0];

    for (let i = 1; i < array.length; i++) {

        if (array[i] > largest) {
            largest = array[i];
        }

        if (array[i] < smallest) {
            smallest = array[i];
        }
    }

    document.getElementById("output").innerHTML =
        "Array = " + array + "<br>" +
        "Largest = " + largest + "<br>" +
        "Smallest = " + smallest;
</script>

</body>
</html>
