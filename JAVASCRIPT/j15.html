<!DOCTYPE html>
<html>
<head>
    <title>Functions</title>
</head>
<body>

<h2>JavaScript Functions</h2>
<p id="output"></p>

<script>
    function add(a, b) {
        return a + b;
    }

    function multiply(a, b) {
        return a * b;
    }

    let result1 = add(10, 20);
    let result2 = multiply(5, 4);

    document.getElementById("output").innerHTML =
        "Addition = " + result1 + "<br>" +
        "Multiplication = " + result2;
</script>

</body>
</html>
