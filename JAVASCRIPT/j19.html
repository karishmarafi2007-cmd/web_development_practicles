<!DOCTYPE html>
<html>
<head>
    <title>JavaScript Objects</title>
</head>
<body>

<h2>JavaScript Object</h2>
<pre id="output"></pre>

<script>
    let student = {
        name: "Karishma",
        age: 18,
        course: "B.Tech",
        university: "Sai University"
    };

    document.getElementById("output").textContent =
        "Name: " + student.name + "\n" +
        "Age: " + student.age + "\n" +
        "Course: " + student.course + "\n" +
        "University: " + student.university;
</script>

</body>
</html>
