<!DOCTYPE html>
<html>
<head>
    <title>Button Click Event</title>
</head>

<body>

    <h2>Button Click Event</h2>

    <button onclick="showMessage()">Click Me</button>

    <p id="message"></p>

    <script>

        function showMessage() {

            document.getElementById("message").innerHTML =
                "Button was clicked!";

        }

    </script>

</body>
</html>
