<!DOCTYPE html>
<html>
<head>
    <title>Stopwatch</title>

    <style>

        body {
            text-align: center;
            font-family: Arial;
            margin-top: 80px;
        }

        #display {
            font-size: 45px;
            margin: 20px;
        }

        button {
            padding: 10px 20px;
            margin: 5px;
        }

    </style>

</head>

<body>

    <h2>Stopwatch</h2>

    <div id="display">00:00:00</div>

    <button onclick="start()">Start</button>
    <button onclick="stop()">Stop</button>
    <button onclick="reset()">Reset</button>

    <script>

        let hours = 0;
        let minutes = 0;
        let seconds = 0;

        let timer = null;

        function updateDisplay() {

            let h = hours < 10 ? "0" + hours : hours;
            let m = minutes < 10 ? "0" + minutes : minutes;
            let s = seconds < 10 ? "0" + seconds : seconds;

            document.getElementById("display").innerHTML =
                h + ":" + m + ":" + s;
        }

        function start() {

            if (timer !== null) {
                return;
            }

            timer = setInterval(function() {

                seconds++;

                if (seconds === 60) {
                    seconds = 0;
                    minutes++;
                }

                if (minutes === 60) {
                    minutes = 0;
                    hours++;
                }

                updateDisplay();

            }, 1000);
        }

        function stop() {

            clearInterval(timer);
            timer = null;
        }

        function reset() {

            stop();

            hours = 0;
            minutes = 0;
            seconds = 0;

            updateDisplay();
        }

    </script>

</body>
</html>
