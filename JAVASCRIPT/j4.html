<!DOCTYPE html>
<html>
<head>
    <title>Even or Odd</title>
</head>
<body>

<h2>Even or Odd</h2>
<p id="output"></p>

<script>
    let number = Number(prompt("Enter a number:"));

    if (number % 2 === 0) {
        document.getElementById("output").innerHTML =
            number + " is Even";
    } else {
        document.getElementById("output").innerHTML =
            number + " is Odd";
    }
</script>

</body>
</html>
