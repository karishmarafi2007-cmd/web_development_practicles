<!DOCTYPE html>
<html>
<head>
    <title>Login Form</title>

    <style>

        body {
            font-family: Arial;
            background-color: lightgray;
        }

        .login-box {
            width: 300px;
            margin: 100px auto;
            padding: 25px;
            background-color: white;
            border-radius: 10px;
        }

        input {
            width: 100%;
            padding: 10px;
            margin: 8px 0;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 10px;
            cursor: pointer;
        }

        #message {
            text-align: center;
        }

        @media (max-width: 500px) {

            .login-box {
                width: 80%;
            }

        }

    </style>

</head>

<body>

    <div class="login-box">

        <h2>Login</h2>

        <form onsubmit="return login()">

            <input type="email"
                   id="email"
                   placeholder="Email">

            <input type="password"
                   id="password"
                   placeholder="Password">

            <button type="submit">Login</button>

        </form>

        <p id="message"></p>

    </div>

    <script>

        function login() {

            let email =
                document.getElementById("email").value.trim();

            let password =
                document.getElementById("password").value;

            let message =
                document.getElementById("message");

            let emailPattern =
                /^[^\s@]+@[^\s@]+\.[^\s@]+$/;


            if (!emailPattern.test(email)) {

                message.innerHTML =
                    "Please enter a valid email.";

                return false;
            }


            if (password.length < 6) {

                message.innerHTML =
                    "Password must contain at least 6 characters.";

                return false;
            }


            message.innerHTML =
                "Login successful!";

            return false;
        }

    </script>

</body>
</html>
