<!DOCTYPE html>
<html>
<head>
    <title>Swap Two Numbers</title>
</head>
<body>

<h2>Swap Two Numbers</h2>

<script>
    let a = 10;
    let b = 20;

    document.write("Before Swapping:<br>");
    document.write("a = " + a + "<br>");
    document.write("b = " + b + "<br><br>");

    let temp = a;
    a = b;
    b = temp;

    document.write("After Swapping:<br>");
    document.write("a = " + a + "<br>");
    document.write("b = " + b);
</script>

</body>
</html>
