<!DOCTYPE html>
<html>
<head>
    <title>Armstrong Number</title>
</head>
<body>

<h2>Armstrong Number</h2>

<script>
    let number = 153;
    let original = number;

    let digits = number.toString().length;
    let sum = 0;

    while (number > 0) {
        let digit = number % 10;
        sum += Math.pow(digit, digits);
        number = Math.floor(number / 10);
    }

    document.write("Number = " + original + "<br>");

    if (sum === original) {
        document.write(original + " is an Armstrong number.");
    } else {
        document.write(original + " is not an Armstrong number.");
    }
</script>

</body>
</html>
