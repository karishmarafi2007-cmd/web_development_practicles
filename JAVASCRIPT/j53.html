<!DOCTYPE html>
<html>
<head>
    <title>Power of a Number</title>
</head>
<body>

<h2>Power of a Number</h2>

<script>
    let base = 2;
    let exponent = 5;

    let result = Math.pow(base, exponent);

    document.write("Base = " + base + "<br>");
    document.write("Exponent = " + exponent + "<br>");
    document.write("Power = " + result);
</script>

</body>
</html>
