<!DOCTYPE html>
<html>
<head>
    <title>Remove Duplicates</title>
</head>
<body>

<h2>Remove Duplicate Elements</h2>

<script>
    let numbers = [10, 20, 10, 30, 20, 40, 30];

    let unique = [...new Set(numbers)];

    document.write("Original Array = " + numbers + "<br><br>");
    document.write("Array after removing duplicates = " + unique);
</script>

</body>
</html>
