<!DOCTYPE html>
<html>
<head>
    <title>Merge Two Arrays</title>
</head>
<body>

<h2>Merge Two Arrays</h2>

<script>
    let array1 = [10, 20, 30];
    let array2 = [40, 50, 60];

    let merged = [...array1, ...array2];

    document.write("Array 1 = " + array1 + "<br>");
    document.write("Array 2 = " + array2 + "<br><br>");
    document.write("Merged Array = " + merged);
</script>

</body>
</html>
