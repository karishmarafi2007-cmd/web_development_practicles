<!DOCTYPE html>
<html>
<head>
    <title>Array Element Frequency</title>
</head>
<body>

<h2>Frequency of Each Array Element</h2>

<script>
    let numbers = [10, 20, 10, 30, 20, 10, 40];

    let frequency = {};

    for (let i = 0; i < numbers.length; i++) {
        let value = numbers[i];

        if (frequency[value]) {
            frequency[value]++;
        } else {
            frequency[value] = 1;
        }
    }

    document.write("Array = " + numbers + "<br><br>");

    for (let value in frequency) {
        document.write(value + " occurs " + frequency[value] + " times<br>");
    }
</script>

</body>
</html>
