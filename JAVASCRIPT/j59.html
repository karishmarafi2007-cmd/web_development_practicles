<!DOCTYPE html>
<html>
<head>
    <title>Common Elements</title>
</head>
<body>

<h2>Common Elements in Two Arrays</h2>

<script>
    let array1 = [10, 20, 30, 40, 50];
    let array2 = [30, 40, 50, 60, 70];

    let common = array1.filter(function(value) {
        return array2.includes(value);
    });

    document.write("Array 1 = " + array1 + "<br>");
    document.write("Array 2 = " + array2 + "<br><br>");
    document.write("Common Elements = " + common);
</script>

</body>
</html>
