<!DOCTYPE html>
<html>
<head>
    <title>Vowels and Consonants</title>
</head>
<body>

<h2>Count Vowels and Consonants</h2>

<script>
    let str = "JavaScript";

    let vowels = 0;
    let consonants = 0;

    str = str.toLowerCase();

    for (let i = 0; i < str.length; i++) {
        let ch = str[i];

        if (ch >= 'a' && ch <= 'z') {
            if (
                ch === 'a' ||
                ch === 'e' ||
                ch === 'i' ||
                ch === 'o' ||
                ch === 'u'
            ) {
                vowels++;
            } else {
                consonants++;
            }
        }
    }

    document.write("String = JavaScript<br>");
    document.write("Number of Vowels = " + vowels + "<br>");
    document.write("Number of Consonants = " + consonants);
</script>

</body>
</html>
