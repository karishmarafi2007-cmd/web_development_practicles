<!DOCTYPE html>
<html>
<head>
    <title>Count Words</title>
</head>
<body>

<h2>Count Number of Words</h2>

<script>
    let str = "JavaScript is very easy to learn";

    let words = str.trim().split(/\s+/);

    document.write("Sentence = " + str + "<br>");
    document.write("Number of Words = " + words.length);
</script>

</body>
</html>
