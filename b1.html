<!DOCTYPE html>
<html>
<head>
    <title>Window Object</title>
</head>

<body>

    <h2>Window Object Demonstration</h2>

    <button onclick="showInfo()">Show Window Information</button>

    <p id="output"></p>

<script>

function showInfo() {

    let output = document.getElementById("output");

    output.innerHTML =
        "Width: " + window.innerWidth + " pixels<br>" +
        "Height: " + window.innerHeight + " pixels<br>" +
        "Screen Width: " + screen.width + " pixels<br>" +
        "Screen Height: " + screen.height + " pixels";

}

</script>

</body>
</html>
