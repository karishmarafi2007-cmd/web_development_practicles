<!DOCTYPE html>
<html>
<head>
    <title>Location Object</title>
</head>

<body>

    <h2>Location Object</h2>

    <p id="output"></p>

    <button onclick="reloadPage()">Reload Page</button>

<script>

document.getElementById("output").innerHTML =
    "Full URL: " + location.href + "<br>" +
    "Hostname: " + location.hostname + "<br>" +
    "Path: " + location.pathname;

function reloadPage() {
    location.reload();
}

</script>

</body>
</html>
